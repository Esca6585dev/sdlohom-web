# /etc/nginx/sites-available/sdlohom.edu.tm  (then: ln -s ... sites-enabled/ && nginx -t && systemctl reload nginx)
# SSL: certbot --nginx -d sdlohom.edu.tm -d www.sdlohom.edu.tm   (or paste the existing Sectigo cert paths below)

server {
    listen 80;
    listen [::]:80;
    server_name sdlohom.edu.tm www.sdlohom.edu.tm;
    return 301 https://www.sdlohom.edu.tm$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sdlohom.edu.tm;
    ssl_certificate     /etc/letsencrypt/live/sdlohom.edu.tm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sdlohom.edu.tm/privkey.pem;
    return 301 https://www.sdlohom.edu.tm$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sdlohom.edu.tm;

    ssl_certificate     /etc/letsencrypt/live/sdlohom.edu.tm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sdlohom.edu.tm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    access_log /var/log/nginx/sdlohom.access.log;
    error_log  /var/log/nginx/sdlohom.error.log;

    # Go API (Fiber) — same origin, no CORS needed in the browser
    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded images / videos / documents — served straight from disk
    location /uploads/ {
        alias /var/www/sdlohom-web/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    # Next.js static assets (long cache)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002/_next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else — Next.js (public site + /admin)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
