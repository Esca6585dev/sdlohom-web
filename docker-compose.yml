services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: sdlohom
      MYSQL_USER: sdlohom
      MYSQL_PASSWORD: ${DB_PASSWORD:-sdlohom}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8090"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8090}
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: sdlohom
      DB_PASS: ${DB_PASSWORD:-sdlohom}
      DB_NAME: sdlohom
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3002}
      TRUST_PROXY: "1"
      EXTERNAL_NEWS_TOKEN: ${EXTERNAL_NEWS_TOKEN:-}
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8090:8090"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8090/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8090/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8090/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
    ports:
      - "3002:3002"

volumes:
  dbdata:
